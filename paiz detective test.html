<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пайыз детективі - Тест</title>
    <style>
        /* Основные стили страницы */
        * { 
            box-sizing: border-box; 
        }
        
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Контейнер для теста */
        .test-container {
            max-width: 700px;
            width: 95%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 2rem;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Заголовок теста */
        .header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 3px solid #667eea;
            padding-bottom: 1.5rem;
        }
        
        .header h1 {
            font-size: 28px;
            color: #333;
            margin: 0 0 0.5rem 0;
            font-weight: 600;
        }
        
        .header p {
            color: #666;
            margin: 0;
            font-size: 14px;
        }
        
        /* Статистика (вопрос/балл) */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 1.5rem;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .stat-label {
            font-size: 11px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 600;
            margin-top: 8px;
        }
        
        /* Прогресс-бар */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0 0 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }
        
        /* Секция вопроса */
        .question-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 2px solid #e0e0e0;
        }
        
        .question-number {
            font-size: 12px;
            color: #667eea;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        
        .question-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            font-weight: 500;
        }
        
        /* Варианты ответов */
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        
        .option {
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }
        
        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(4px);
        }
        
        .option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        /* Кнопки */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 1.5rem;
        }
        
        button {
            padding: 14px;
            border-radius: 10px;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        button.primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:not(.primary) {
            background: #e0e0e0;
            color: #333;
        }
        
        button:not(.primary):hover:not(:disabled) {
            background: #d0d0d0;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Результаты теста */
        .test-result {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            color: white;
            animation: slideIn 0.5s ease-out;
        }
        
        .test-result h2 {
            font-size: 32px;
            margin: 0 0 1rem 0;
            font-weight: 600;
        }
        
        .final-score {
            font-size: 56px;
            font-weight: 700;
            margin: 1.5rem 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .final-text {
            font-size: 16px;
            margin: 1rem 0;
            opacity: 0.95;
            line-height: 1.5;
        }
        
        /* Скрытые элементы */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <!-- Заголовок -->
        <div class="header">
            <h1>🔍 Пайыз детективі</h1>
            <p>Тест - Өзіңді тексеріңіз!</p>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Сұрақ</div>
                    <div class="stat-value"><span id="currentQuestion">1</span>/10</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Балл</div>
                    <div class="stat-value" id="scoreDisplay">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Статус</div>
                    <div class="stat-value" id="statusDisplay">▶</div>
                </div>
            </div>
        </div>

        <!-- Содержимое теста -->
        <div id="testContent"></div>
    </div>

    <script>
        // Массив вопросов для теста
        const questions = [
            {
                question: "25 оқушының 40%-ы спортпен айналысса, қанша оқушы спортпен айналысады?",
                options: ["8", "10", "12", "15"],
                correct: 1,
                formula: "25 × 40% = 25 × 0.4 = 10"
            },
            {
                question: "Өнімнің бағасы 5000 теңге. 20% дисконт қолданылса, өнімнің соңғы бағасы қанша?",
                options: ["3500 теңге", "4000 теңге", "4500 теңге", "5200 теңге"],
                correct: 1,
                formula: "5000 - (5000 × 20%) = 5000 - 1000 = 4000 теңге"
            },
            {
                question: "Саудагерлік компания өткіліктеріндегі 120 ішінде 30 сауда орындалды. Орындалған сауданың пайызы қанша?",
                options: ["20%", "25%", "30%", "35%"],
                correct: 1,
                formula: "(30 ÷ 120) × 100% = 25%"
            },
            {
                question: "Балаларға арналған іс-әрекет 18 адамды сақтап отыр. Олардың 50%-ы қыздар болса, қыздарының саны қанша?",
                options: ["6", "7", "8", "9"],
                correct: 2,
                formula: "18 × 50% = 18 × 0.5 = 9"
            },
            {
                question: "Мектептің кітапханасында 200 кітап болды. Жылдың соңында кітап саны 20% өсіп қалды. Қазір кітапханада қанша кітап?",
                options: ["220", "240", "260", "280"],
                correct: 1,
                formula: "200 + (200 × 20%) = 200 + 40 = 240"
            },
            {
                question: "Студенттің ақы 80000 теңге. Оның 35%-ы төленсе, қалған қанша теңге?",
                options: ["28000", "48000", "52000", "58000"],
                correct: 2,
                formula: "80000 - (80000 × 35%) = 80000 - 28000 = 52000 теңге"
            },
            {
                question: "Компанияның түкі $100,000. Прибыль $25,000 болса, прибыльдің пайызы қанша?",
                options: ["15%", "20%", "25%", "30%"],
                correct: 2,
                formula: "(25000 ÷ 100000) × 100% = 25%"
            },
            {
                question: "Қатарда 50 адам болды. 10 адам кеттісінде, қалғандарының пайызы қанша?",
                options: ["70%", "75%", "80%", "85%"],
                correct: 2,
                formula: "((50 - 10) ÷ 50) × 100% = (40 ÷ 50) × 100% = 80%"
            },
            {
                question: "Қара диаграммасында 360°. 25%-ын білдіретін сектор қанша градус?",
                options: ["45°", "60°", "75°", "90°"],
                correct: 3,
                formula: "360° × 25% = 360 × 0.25 = 90°"
            },
            {
                question: "Тест 50 сұрақтан тұрады. Студент 45 сұраққа дұрыс жауап берсе, дұрыс жауап беруінің пайызы қанша?",
                options: ["85%", "90%", "95%", "98%"],
                correct: 1,
                formula: "(45 ÷ 50) × 100% = 0.9 × 100% = 90%"
            }
        ];

        // Переменные для отслеживания прогресса
        let currentQ = 0;
        let score = 0;
        let answered = false;
        let selectedAnswer = null;
        let userAnswers = []; // Сохраняем ответы пользователя

        // Функция отображения текущего вопроса
        function renderQuestion() {
            const q = questions[currentQ];
            const progress = ((currentQ) / questions.length) * 100;
            
            // Обновляем прогресс-бар
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentQuestion').textContent = currentQ + 1;
            document.getElementById('scoreDisplay').textContent = score;
            
            // Генерируем HTML для вопроса
            let html = `
                <div class="question-section">
                    <div class="question-number">Сұрақ ${currentQ + 1} / ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
            `;
            
            // Добавляем варианты ответов
            q.options.forEach((option, idx) => {
                let classes = 'option';
                let disabled = answered ? 'style="cursor:not-allowed"' : '';
                
                // Выделяем выбранный вариант
                if (idx === selectedAnswer) {
                    classes += ' selected';
                }
                
                html += `<div class="${classes}" ${disabled} onclick="${answered ? '' : 'selectOption(' + idx + ')'}\">${option}</div>`;
            });
            
            html += `</div>`;
            
            // Кнопки для следующего действия
            html += `<div class="button-group">`;
            if (!answered) {
                html += `<button onclick="submitAnswer()" class="primary" ${selectedAnswer === null ? 'disabled' : ''}>Жауап</button>`;
                html += `<button onclick="skipQuestion()">Өтіп кету</button>`;
            } else {
                if (currentQ < questions.length - 1) {
                    html += `<button onclick="nextQuestion()" class="primary" style="grid-column: 1/-1;">Келесі →</button>`;
                } else {
                    html += `<button onclick="endTest()" class="primary" style="grid-column: 1/-1;">Нәтижелер</button>`;
                }
            }
            html += `</div></div>`;
            
            document.getElementById('testContent').innerHTML = html;
        }

        // Функция выбора варианта ответа
        function selectOption(idx) {
            if (!answered) {
                selectedAnswer = idx;
                renderQuestion();
            }
        }

        // Функция отправки ответа
        function submitAnswer() {
            const q = questions[currentQ];
            answered = true;
            
            // Сохраняем выбранный ответ
            userAnswers.push({
                question: q.question,
                selected: selectedAnswer,
                correct: q.correct,
                isCorrect: selectedAnswer === q.correct
            });
            
            // Увеличиваем балл если ответ верный
            if (selectedAnswer === q.correct) {
                score += 10;
            }
            
            renderQuestion();
        }

        // Функция пропуска вопроса
        function skipQuestion() {
            nextQuestion();
        }

        // Функция перехода к следующему вопросу
        function nextQuestion() {
            currentQ++;
            answered = false;
            selectedAnswer = null;
            
            if (currentQ < questions.length) {
                renderQuestion();
            } else {
                endTest();
            }
        }

        // Функция завершения теста и показа результатов
        function endTest() {
            const percentage = Math.round((score / (questions.length * 10)) * 100);
            let message = "";
            let emoji = "";
            
            // Определяем сообщение в зависимости от результата
            if (percentage === 100) {
                message = "Өте сүрін! Пайыздарда сиз ұста! 🏆";
                emoji = "🥇";
            }
            else if (percentage >= 80) {
                message = "Керемет! Пайыздарды жақсы білесіңіз! 🌟";
                emoji = "🥈";
            }
            else if (percentage >= 60) {
                message = "Жақсы! Тағы да қатарлаңыз! 💪";
                emoji = "🥉";
            }
            else {
                message = "Неге болмасы! Тағы да рет өңдеңіз! 📚";
                emoji = "📖";
            }
            
            // Отображаем результаты
            document.getElementById('testContent').innerHTML = `
                <div class="test-result">
                    <h2>${emoji} Тест аяқталды!</h2>
                    <div class="final-score">${score}/${questions.length * 10}</div>
                    <div class="final-text">${percentage}% дұрыс</div>
                    <div class="final-text">${message}</div>
                    <button onclick="location.reload()" class="primary" style="width: 100%; margin-top: 1.5rem;">Қайта іске кіру</button>
                </div>
            `;
        }

        // Инициализация теста при загрузке страницы
        renderQuestion();
    </script>
</body>
</html>
